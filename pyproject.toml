[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "RocioMaSala", email = "martinrocio16@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
llm-sdk = { workspace = true }

[tool.uv.workspace]
members = [
    "llm_sdk",
]
