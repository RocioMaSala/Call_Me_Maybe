[project]
name = "call-me-maybe"
version = "0.1.0"
description = "A constrained decoding project for LLMs"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
    "flake8",
    "mypy"
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/llm_sdk"

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true


