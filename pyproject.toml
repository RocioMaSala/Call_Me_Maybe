[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "RocioMaSala", email = "martinrocio16@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
llm-sdk = { workspace = true }

[tool.uv.workspace]
members = [
    "llm_sdk",
]
