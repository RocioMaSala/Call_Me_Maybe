[project]
name = "call-me-maybe"
version = "0.1.0"
description = "A constrained decoding project for LLMs"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
    "flake8",
    "mypy"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
llm-sdk = { path = "./llm_sdk" }


